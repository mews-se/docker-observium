name: build

on:
    push:
        branches:
            - main
        paths-ignore:
            - "README.md"
            - "LICENSE"
    schedule:
        # Weekly rebuild: picks up new Observium CE releases and base image
        # security updates. The OBSERVIUM_REFRESH build-arg busts the tarball
        # layer cache so the download actually happens.
        - cron: "20 4 * * 1"
    workflow_dispatch:

env:
    IMAGE: ghcr.io/${{ github.repository_owner }}/observium

# A push racing the weekly cron could interleave two merge jobs' tag pushes
concurrency:
    group: build
    cancel-in-progress: false

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      platform: linux/amd64
                      arch: amd64
                    - runner: ubuntu-24.04-arm
                      platform: linux/arm64
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        outputs:
            ce_version: ${{ steps.version.outputs.ce_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build image for smoke test
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: observium-test
                  provenance: false
                  build-args: |
                      OBSERVIUM_REFRESH=${{ github.run_id }}

            - name: Smoke test
              run: |
                  set -eux
                  docker network create obs-test
                  docker run -d --name db --network obs-test \
                      -e MARIADB_RANDOM_ROOT_PASSWORD=yes \
                      -e MARIADB_DATABASE=observium \
                      -e MARIADB_USER=observium \
                      -e MARIADB_PASSWORD=smoketest \
                      mariadb:11
                  docker run -d --name web --network obs-test -p 8080:80 \
                      -e DB_PASS=smoketest \
                      -e OBSERVIUM_ADMIN_USER=admin \
                      -e OBSERVIUM_ADMIN_PASS=smoketest \
                      observium-test
                  for i in $(seq 1 90); do
                      if curl -fsI http://localhost:8080/ >/dev/null 2>&1; then break; fi
                      sleep 2
                  done
                  curl -fsI http://localhost:8080/
                  docker logs web 2>&1 | grep -q "User admin added successfully"
                  docker run -d --name poller --network obs-test \
                      -e DB_PASS=smoketest \
                      observium-test poller
                  for i in $(seq 1 30); do
                      if docker exec poller test -f /etc/cron.d/observium; then break; fi
                      sleep 2
                  done
                  # run one job exactly as cron will: its PATH, its user
                  cronpath="$(docker exec poller sed -n 's/^PATH=//p' /etc/cron.d/observium)"
                  test -n "$cronpath"
                  docker exec poller su -s /bin/sh www-data -c "env -i PATH=$cronpath /opt/observium/observium-wrapper poller"
                  docker exec poller su -s /bin/sh www-data -c "env -i PATH=$cronpath env php -v" >/dev/null
                  docker rm -f poller web db
                  docker network rm obs-test

            - name: Dump container logs on failure
              if: failure()
              run: |
                  for c in web poller db; do
                      echo "=== $c"; docker logs "$c" 2>&1 | tail -50 || true
                  done

            - name: Extract CE version
              id: version
              run: |
                  ce_version="$(docker run --rm --entrypoint cat observium-test /opt/observium/VERSION | grep -oE '[0-9]+\.[0-9]+' | head -1)"
                  test -n "$ce_version"
                  echo "ce_version=$ce_version" >> "$GITHUB_OUTPUT"
                  mkdir -p /tmp/versions
                  echo "$ce_version" > "/tmp/versions/${{ matrix.arch }}"

            - name: Upload version
              uses: actions/upload-artifact@v7
              with:
                  name: version-${{ matrix.arch }}
                  path: /tmp/versions/*
                  if-no-files-found: error
                  retention-days: 1

            - name: Push image by digest
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  # no provenance attestation: it shows up as an extra
                  # unknown/unknown platform in registry UIs
                  provenance: false
                  outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
                  build-args: |
                      OBSERVIUM_REFRESH=${{ github.run_id }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.push.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v7
              with:
                  name: digest-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-24.04
        permissions:
            packages: write
        env:
            # Docker Hub mirroring activates itself once the two secrets exist
            HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        steps:
            - name: Download digests
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digest-*
                  merge-multiple: true

            - name: Download versions
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/versions
                  pattern: version-*
                  merge-multiple: true

            - name: Check the arch builds agree on the CE version
              # a CE release published between the two downloads would merge
              # different versions into one manifest - rerun instead
              run: test "$(sort -u /tmp/versions/* | wc -l)" -eq 1

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create multi-arch manifest
              working-directory: /tmp/digests
              run: |
                  set -eux
                  ce_version="${{ needs.build.outputs.ce_version }}"
                  datetag="$(date +%Y%m%d)"
                  digests=""
                  for f in *; do digests="$digests ${IMAGE}@sha256:$f"; done
                  docker buildx imagetools create \
                      -t "${IMAGE}:latest" \
                      -t "${IMAGE}:${ce_version}" \
                      -t "${IMAGE}:${ce_version}-${datetag}" \
                      $digests

            - name: Inspect result
              run: docker buildx imagetools inspect "${IMAGE}:latest"

            - name: Mirror to Docker Hub
              if: env.HAS_DOCKERHUB == 'true'
              run: |
                  set -eu
                  sudo apt-get update -q
                  sudo apt-get install -yq skopeo
                  # Trim whitespace/CR that easily sneaks in when secrets are pasted
                  hub_user="$(printf %s '${{ secrets.DOCKERHUB_USERNAME }}' | tr -d '[:space:]')"
                  printf %s '${{ secrets.DOCKERHUB_TOKEN }}' | tr -d '[:space:]' | \
                      skopeo login -u "$hub_user" --password-stdin docker.io
                  ce_version="${{ needs.build.outputs.ce_version }}"
                  datetag="$(date +%Y%m%d)"
                  for tag in latest "$ce_version" "$ce_version-$datetag"; do
                      skopeo copy --all \
                          "docker://${IMAGE}:$tag" \
                          "docker://docker.io/${hub_user}/observium:$tag"
                  done

            # No README/description sync to Docker Hub: sessions derived from
            # access tokens carry scope repo:write only, and the repository
            # metadata PATCH returns 403 for them (verified empirically).
            # Editing the description requires a password session, which does
            # not belong in CI — the two Hub text fields are maintained by
            # hand instead.
